# Shell-executor LXD runner (ci/lxd/): xschem/ngspice/python toolchain,
# sky130 PDK at $PDK_ROOT (from /etc/profile.d/pdk.sh).
#
# Assertion policy (DESIGN.md): precision-path SNDR scatters +-1 dB
# run-to-run (chaotic modulator) -- only loose floors, never exact values.

# Lockdown: pipelines run ONLY for direct pushes to branches in THIS
# project (membership required to push). No merge-request pipelines --
# fork MRs must never execute on the private runner VM. Defense in depth
# on top of: project runner not shared with forks, and no
# merge_request_event rules anywhere below.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Two pipeline flavors:
#   push     -- everything that feeds the generated design document
#               (fast; the Pages site rebuilds from these artifacts)
#   schedule -- nightly heavy verification that does NOT inform the
#               manual: full assembly/frame regression + extracted-top
#               process-corner acceptance
.push:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# shell executor may not source /etc/profile.d -- set PDK_ROOT explicitly
variables:
  PDK_ROOT: /opt/pdk

stages:
  - smoke
  - reports
  - layout
  - pages

snr:
  extends: .push
  stage: smoke
  script:
    - make clean
    - make snr | tee snr.log
    # loose floor only: fast path is stable, 35 dB is far below nominal ~39
    - awk '/fast/ { if ($4 < 35) { print "FAIL fast-path SNDR " $4; exit 1 } }' snr.log
    - python3 tools/gen_doc_figs.py tier1
  artifacts:
    paths: [reports/results/]
    expire_in: 30 days

fet-char:
  extends: .push
  stage: smoke
  script:
    - make char
  artifacts:
    paths: [reports/fet_char.html]
    expire_in: 30 days

dac-report:
  extends: .push
  stage: reports
  script:
    - make report
  artifacts:
    paths: [reports/dac_compare.html]
    expire_in: 30 days

ota-specs:
  extends: .push
  stage: reports
  script:
    - make specs
  artifacts:
    paths: [reports/ota_specs.html]
    expire_in: 30 days

# full layout verification chain (needs source-built magic + netgen on the
# runner -- ci/lxd/cloud-init.yml provisions them):
#   xcheck  = golden netlist generated + schematic equivalence proven
#   ota_tb  = schematic-level metrics (JSON for the docs page)
#   pex     = parasitic extraction + same TB on the extracted netlist
#   layout_report = fresh-process DRC (must be 0) + netgen LVS (must match)
#                   + GDS export + 3D geometry for the pages viewer
layout-verify:
  extends: .push
  stage: layout
  script:
    - make xcheck
    - python3 sim/ota_tb.py
    - python3 tools/pex_ota.py
    - python3 sim/ota_tb.py --pex
    - python3 tools/layout_report.py
    - python3 tools/gen_doc_figs.py ota
  artifacts:
    paths:
      - reports/results/
      - reports/ota_layout.gds
    expire_in: 30 days

# comparator + retimer verification (quick grid; the corner sweep and the
# offset Monte Carlo are dev-bench runs -- their page rows only appear on
# builds that ran them)
comparator:
  extends: .push
  stage: layout
  script:
    - python3 sim/comp_tb.py --quick
    - make compcheck
    - python3 sim/dff_tb.py
    - python3 tools/gen_doc_figs.py comp
  artifacts:
    paths: [reports/results/]
    expire_in: 30 days

# bias generator + reference buffers + clock level shifter (each exits
# nonzero if its acceptance gate fails)
support-blocks:
  extends: .push
  stage: layout
  script:
    - make xcheck
    - python3 sim/bias_tb.py
    - python3 sim/bias_tb.py --layout
    - python3 sim/buf_tb.py
    - python3 sim/lvl_tb.py
    - python3 sim/odrv_tb.py
    - make blockcheck
  artifacts:
    paths: [reports/results/]
    expire_in: 30 days

# GitLab Pages: the generated design document, with every number sourced
# from THIS pipeline's artifacts (tools/gen_docs.py marks anything missing
# as "not verified in this build")
pages:
  stage: pages
  needs:
    - job: snr
      artifacts: true
    - job: fet-char
      artifacts: true
    - job: dac-report
      artifacts: true
    - job: ota-specs
      artifacts: true
    - job: layout-verify
      artifacts: true
    - job: comparator
      artifacts: true
    - job: support-blocks
      artifacts: true
  script:
    - python3 tools/block_report.py
    - python3 tools/gen_docs.py
  artifacts:
    paths: [public]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------- nightly
# Scheduled pipeline only. Assembly is a full from-source regression of
# the top level: reroute, repaint, fresh-process DRC, LVS, then the TT
# frame build + GDS/LEF export. Catches any drift between the committed
# mag/ state and what the generators produce.
assembly-verify:
  stage: layout
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - set -o pipefail
    - python3 tools/asm_route.py
    # the LVS reference chain is all build products: OTA xschem
    # netlist (make xcheck), block goldens, then the top golden
    - make xcheck
    - python3 tools/gen_golden.py
    - python3 tools/gen_top_golden.py
    - python3 tools/asm_top.py | tee asm.log
    - 'grep -Fq "DRC errors (fresh reload): 0" asm.log'
    - 'grep -Fq "sd_top: LVS match" asm.log'
    - make tt | tee tt.log
    - grep -Fq "DRCCOUNT 0" tt.log
    - grep -Fq "EXPORT DONE" tt.log

# Extracted-top acceptance at the slow and fast process corners (the
# push pipeline's numbers are tt/27C only). Each corner is a ~25 min
# transistor-level transient; results land as top_pex_<corner>.json
# artifacts, not on the site.
top-corners:
  stage: layout
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - python3 tools/pex_top.py
    # corner gates sit ~1 dB under first-characterization values
    # (2026-07-25: ss measured 29.9 vs 34.0 at tt -- slower
    # comparator regeneration and clk33 edges at the slow corner);
    # ff provisional until first green run
    - python3 sim/top_tb.py --corner ss --gate 29
    - python3 sim/top_tb.py --corner ff --gate 30
  artifacts:
    paths: [reports/results/]
    expire_in: 30 days
